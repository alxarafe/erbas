spring.application.name=erbas
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
server.port=8080

spring.datasource.url=${ERBAS_DATASOURCE_URL:jdbc:postgresql://localhost:5432/erbas_dev}
spring.datasource.username=${ERBAS_DATASOURCE_USERNAME:erbas}
spring.datasource.password=${ERBAS_DATASOURCE_PASSWORD:erbas_local_only}
spring.flyway.locations=classpath:db/migration
