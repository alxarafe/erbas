name: Java CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docker-build-and-test:
    name: Authoritative backend and shared contract validation
    runs-on: ubuntu-24.04

    steps:
      - name: Check out Java
        uses: actions/checkout@v7.0.1
        with:
          path: erbas
          persist-credentials: false

      - name: Check out published contract v0.5.0
        uses: actions/checkout@v7.0.1
        with:
          repository: alxarafe/erbas-contract
          ref: v0.5.0
          path: erbas-contract
          persist-credentials: false

      - name: Validate backend and shared conformance
        working-directory: erbas
        env:
          ERBAS_CONTRACT_DIR: ${{ github.workspace }}/erbas-contract
        run: ./bin/check
