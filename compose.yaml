services:
  build:
    build:
      context: .
      target: build
    command: ./mvnw --batch-mode --no-transfer-progress clean verify

  postgres:
    image: postgres:18.6@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae
    environment:
      POSTGRES_DB: ${ERBAS_DB_NAME:-erbas_dev}
      POSTGRES_USER: ${ERBAS_DB_USER:-erbas}
      POSTGRES_PASSWORD: ${ERBAS_DB_PASSWORD:-erbas_local_only}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql

  app:
    build:
      context: .
      target: runtime
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ERBAS_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${ERBAS_DB_NAME:-erbas_dev}
      ERBAS_DATASOURCE_USERNAME: ${ERBAS_DB_USER:-erbas}
      ERBAS_DATASOURCE_PASSWORD: ${ERBAS_DB_PASSWORD:-erbas_local_only}
    ports:
      - "127.0.0.1:${ERBAS_JAVA_PORT:-48080}:8080"
    read_only: true
    tmpfs:
      - /tmp

volumes:
  postgres_data:
